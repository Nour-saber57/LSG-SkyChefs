<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LSG Sky Chefs</title>
  <link rel="stylesheet" href="/assets/workspace.css">
  <script src="/assets/workspace.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">LSG <span>Sky Chefs</span></div>
      <div class="account">
        <span id="account-name"></span>
        <button id="logout" type="button" class="secondary">Log out</button>
      </div>
    </div>
  </header>

  <main>
    <nav aria-label="Navigation">
      <a id="back" href="/" hidden>Back</a>
    </nav>

    <p id="session-feedback" class="feedback" role="alert" hidden></p>
    <h1 id="page-title">Loading…</h1>
    <p id="page-description" class="muted"></p>

    <section id="navigation-card" class="panel" hidden>
      <a id="next" class="service-link" href="/"></a>
      <p id="next-description" class="muted"></p>
    </section>

    <section id="secondary-navigation-card" class="panel" hidden>
      <a id="next-secondary" class="service-link" href="/"></a>
      <p id="next-secondary-description" class="muted"></p>
    </section>

    <section id="tertiary-navigation-card" class="panel" hidden>
      <a id="next-tertiary" class="service-link" href="/"></a>
      <p id="next-tertiary-description" class="muted"></p>
    </section>

    <section id="quaternary-navigation-card" class="panel" hidden>
      <a id="next-quaternary" class="service-link" href="/"></a>
      <p id="next-quaternary-description" class="muted"></p>
    </section>

    <section id="salary-panel" class="panel" hidden>
      <form id="salary-form" method="post">
        <label for="message">Your message</label>
        <textarea
          id="message"
          name="message"
          rows="6"
          maxlength="3000"
          placeholder="What would you like HR to help with?"
          required
        ></textarea>
        <button type="submit">Send</button>
        <p id="salary-feedback" class="feedback" role="status" aria-live="polite" hidden></p>
      </form>
    </section>

    <section id="hr-letter-panel" class="panel" hidden>
      <form id="hr-letter-form" method="post">
        <label for="hr-letter-message">Write your HR Letter request</label>
        <textarea
          id="hr-letter-message"
          name="message"
          rows="8"
          maxlength="3000"
          placeholder="Describe the HR letter you need and include any relevant details."
          required
        ></textarea>
        <button type="submit">Send request</button>
        <p id="hr-letter-feedback" class="feedback" role="status" aria-live="polite" hidden></p>
      </form>
    </section>

    <section id="holiday-panel" class="panel" hidden>
      <form id="holiday-form" method="post">
        <label for="holiday-start-date">First day of holiday</label>
        <input id="holiday-start-date" name="start_date" type="date" required>
        <label for="holiday-end-date">Last day of holiday</label>
        <input id="holiday-end-date" name="end_date" type="date" required>
        <label for="holiday-reason">Why are you requesting this holiday?</label>
        <textarea
          id="holiday-reason"
          name="reason"
          rows="6"
          maxlength="3000"
          placeholder="Enter the reason for your holiday request."
          required
        ></textarea>
        <button type="submit">Submit holiday request</button>
        <p id="holiday-feedback" class="feedback" role="status" aria-live="polite" hidden></p>
      </form>
    </section>

    <section id="insurance-panel" class="panel" hidden>
      <h2>Insurance request</h2>
      <p>Enter your employee code and message for HR.</p>
      <form id="insurance-form" method="post">
        <label for="insurance-employee-code">Employee code</label>
        <input
          id="insurance-employee-code"
          name="employee_code"
          type="text"
          inputmode="numeric"
          maxlength="50"
          required
        >
        <label for="insurance-message">Your message</label>
        <textarea
          id="insurance-message"
          name="message"
          rows="6"
          maxlength="3000"
          placeholder="Describe your insurance request."
          required
        ></textarea>
        <button type="submit">Send insurance request</button>
        <p id="insurance-feedback" class="feedback" role="status" aria-live="polite" hidden></p>
      </form>

      <hr>
      <h2>Insurance change</h2>
      <p>Submit a request to change your insurance details.</p>
      <form id="insurance-change-form" method="post">
        <button type="submit">Request an insurance change</button>
        <p id="insurance-change-feedback" class="feedback" role="status" aria-live="polite" hidden></p>
      </form>
    </section>

    <section id="courses-panel" class="panel" hidden>
      <div class="inbox-heading">
        <h2>Available courses</h2>
        <button id="refresh-courses" class="secondary" type="button">Refresh</button>
      </div>
      <p id="courses-feedback" class="feedback" role="status" aria-live="polite" hidden></p>
      <div id="courses-list" class="course-list"></div>
    </section>

    <section id="admin-courses-panel" hidden>
      <section class="panel">
        <h2>Add a course</h2>
        <form id="course-form" enctype="multipart/form-data">
          <label for="course-title">Course title</label>
          <input id="course-title" name="title" type="text" maxlength="150" required>
          <label for="course-description">Details</label>
          <textarea id="course-description" name="description" rows="5" maxlength="5000" required></textarea>
          <label for="course-start-date">Start date</label>
          <input id="course-start-date" name="start_date" type="date" required>
          <label for="course-duration">Duration</label>
          <input id="course-duration" name="duration" type="text" maxlength="100" placeholder="e.g. 2 days" required>
          <label for="course-location">Location</label>
          <input id="course-location" name="location" type="text" maxlength="150" required>
          <label for="course-image">Course image (JPEG, PNG, or WebP; up to 5 MB)</label>
          <input id="course-image" name="image" type="file" accept="image/jpeg,image/png,image/webp">
          <button type="submit">Add course</button>
          <p id="course-form-feedback" class="feedback" role="status" aria-live="polite" hidden></p>
        </form>
      </section>
      <section class="panel" aria-label="Course enrollment and excuses">
        <div class="inbox-heading">
          <h2>Course responses</h2>
          <button id="refresh-admin-courses" class="secondary" type="button">Refresh</button>
        </div>
        <p id="admin-courses-feedback" class="feedback" role="status" aria-live="polite" hidden></p>
        <div id="admin-courses-list" class="course-list"></div>
      </section>
    </section>

    <section id="inbox-panel" class="panel" aria-label="HR messages" hidden>
      <div class="inbox-heading">
        <h2>Messages</h2>
        <button id="refresh" class="secondary" type="button">Refresh</button>
      </div>

      <p id="inbox-feedback" class="feedback" role="status" aria-live="polite" hidden></p>
      <ol id="messages"></ol>
      <button id="load-more" class="secondary" type="button" hidden>Load more</button>
    </section>

    <section id="holiday-requests-panel" class="panel" aria-label="Employee holiday requests" hidden>
      <div class="inbox-heading">
        <h2>Holiday requests</h2>
        <button id="refresh-holidays" class="secondary" type="button">Refresh</button>
      </div>
      <p id="holiday-requests-feedback" class="feedback" role="status" aria-live="polite" hidden></p>
      <ol id="holiday-requests"></ol>
      <button id="load-more-holidays" class="secondary" type="button" hidden>Load more</button>
    </section>

    <section id="insurance-requests-panel" class="panel" aria-label="Employee insurance requests" hidden>
      <div class="inbox-heading">
        <h2>Insurance requests</h2>
        <button id="refresh-insurance" class="secondary" type="button">Refresh</button>
      </div>
      <p id="insurance-requests-feedback" class="feedback" role="status" aria-live="polite" hidden></p>
      <ol id="insurance-requests"></ol>
      <button id="load-more-insurance" class="secondary" type="button" hidden>Load more</button>

      <div class="inbox-heading">
        <h2>Insurance changes</h2>
        <button id="refresh-insurance-changes" class="secondary" type="button">Refresh</button>
      </div>
      <p id="insurance-changes-feedback" class="feedback" role="status" aria-live="polite" hidden></p>
      <ol id="insurance-changes"></ol>
      <button id="load-more-insurance-changes" class="secondary" type="button" hidden>Load more</button>
    </section>
  </main>
</body>
</html>
