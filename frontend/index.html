  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Inter", system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3.5rem;
    padding: 2rem 1rem 6rem;
    position: relative;
    overflow-x: hidden;
    color: var(--navy);
    /* الصورة أولاً، ولو مش موجودة بيظهر تدرج غروب الشمس */
    background:
      var(--bg-image) center / cover no-repeat,
      linear-gradient(180deg, #9fb7dc 0%, #c9c3d6 30%, #f2c6a0 55%, #f6a95b 70%, #6d7a93 85%, #3a4a68 100%);
  }

  /* Logo */
  .brand { display: flex; align-items: center; gap: 1.1rem; position: relative; top: 1.75rem; }
  .brand svg { width: clamp(70px, 14vw, 100px); height: auto; }
  .brand-text { line-height: .95; font-weight: 800; letter-spacing: -.03em; color: var(--navy); }
  .brand-text .top { font-size: clamp(2rem, 6vw, 3rem); display: block; }
  .brand-text .bottom { font-size: clamp(2rem, 6vw, 3rem); display: block; font-weight: 700; letter-spacing: -.05em; }

  /* Card */
  .card {
    width: 100%;
    max-width: 460px;
    padding: 2rem 2.4rem 2.4rem;
    border-radius: 28px;
    background: rgba(255,255,255,.72);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,.7);
    box-shadow: 0 20px 50px rgba(10,37,89,.18);
    text-align: center;
  }
  .plane-row { display: flex; align-items: center; gap: 1rem; margin-bottom: .6rem; }
  .plane-row::before, .plane-row::after { content: ""; flex: 1; height: 1.5px; background: #8f9bb3; }
  .plane-row svg { width: 54px; height: 54px; fill: var(--navy); }
  h1 { font-size: clamp(1.9rem, 5vw, 2.5rem); font-weight: 800; letter-spacing: -.02em; }
  .sub { margin: .4rem 0 1.8rem; font-size: 1.15rem; color: var(--text-soft); font-weight: 500; }

  .field {
    position: relative;
    margin-bottom: 1rem;
  }
  .field svg {
    position: absolute; left: 1.3rem; top: 50%; transform: translateY(-50%);
    width: 24px; height: 24px; fill: var(--navy); pointer-events: none;
  }
  .field input {
    width: 100%;
    height: 62px;
    padding: 0 1.2rem 0 4.2rem;
    border-radius: 16px;
    border: 1.5px solid #dfe3ec;
    background: rgba(255,255,255,.85);
    font: 500 1.15rem "Inter", sans-serif;
    color: var(--navy);
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .field input::placeholder { color: #5a6788; }
  .field input:focus { border-color: var(--navy); box-shadow: 0 0 0 4px rgba(10,37,89,.15); }

  .btn {
    margin-top: .8rem;
    width: 100%;
    height: 64px;
    border: 0;
    border-radius: 999px;
    background: var(--navy);
    color: #fff;
    font: 700 1.3rem "Inter", sans-serif;
    display: flex; align-items: center; justify-content: center; gap: .8rem;
    cursor: pointer;
    transition: transform .15s, background .2s;
  }
  .btn:hover { background: #0d3076; }
  .btn:active { transform: scale(.98); }
  .btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  .btn svg { width: 26px; height: 26px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .error { min-height: 1.3em; margin-top: .8rem; color: #b3261e; font-size: .95rem; font-weight: 500; }

  /* Welcome message */
  .welcome h2 { font-size: clamp(1.6rem, 4.5vw, 2.1rem); font-weight: 800; margin: 1rem 0 .5rem; word-break: break-word; }
  .welcome p { color: var(--text-soft); font-size: 1.1rem; margin-bottom: 1.2rem; }

  /* Bottom-right diagonal */
  .corner {
    position: fixed; right: 0; bottom: 0;
    width: 62vw; max-width: 760px; height: 150px;
    background: var(--gold);
    clip-path: polygon(100% 0, 100% 100%, 0 100%);
    pointer-events: none;
  }
  .corner::after {
    content: ""; position: absolute; inset: 0;
    background: var(--navy);
    clip-path: polygon(100% 14%, 100% 100%, 8% 100%);
  }

  @media (max-width: 480px) {
    .card { padding: 1.5rem 1.2rem 1.8rem; }
    body { gap: 2rem; }
    .brand { top: 1rem; }
  }
</style>
</head>

    <div class="plane-row">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>

    <p class="sub">Welcome to LSG Sky Chefs</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-4 0-8 2-8 5v3h16v-3c0-3-4-5-8-5z"/></svg>
        <input type="text" id="employeeId" name="identity" placeholder="Employee ID or work email" autocomplete="username" maxlength="254" required>
      </div>
      <div class="field">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm1 4v2h16V8H4zm1.5 4.5v2h5v-2h-5zm0 3v1.5h3V15.5h-3z"/></svg>
        <input type="password" id="password" name="password" placeholder="Password" autocomplete="current-password" maxlength="1024" required>
      </div>

        Login
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg>
      </button>

  <div class="corner" aria-hidden="true"></div>

<script>
  var form = document.getElementById("loginForm");
  var welcome = document.getElementById("welcome");
  var error = document.getElementById("error");
  var apiBase = window.location.port === "5173"
    ? "http://localhost:8000"
    : window.location.origin;
  var csrfToken = "";

  function showWelcome(user) {
    document.getElementById("welcomeName").textContent = user.name;
    document.getElementById("welcomeId").textContent = user.identity;
    form.hidden = true;
    welcome.hidden = false;
  }

  function redirectForRole(user) {
    window.location.assign(user.role === "admin" ? "/admin/dashboard" : "/dashboard");
  }

  async function restoreSession() {
    try {
      var response = await fetch(apiBase + "/api/v1/me", {
        credentials: "include"
      });
      if (!response.ok) return;
      showWelcome(await response.json());

      var csrfResponse = await fetch(apiBase + "/api/v1/auth/csrf", {
        credentials: "include"
      });
      if (csrfResponse.ok) {
        csrfToken = (await csrfResponse.json()).csrf_token;
      }
    } catch (_) {
      // The login page remains usable if the API is unavailable.
    }
  }

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    var identity = document.getElementById("employeeId").value.trim();
    var password = document.getElementById("password").value;
    var button = form.querySelector("button");

    if (!identity || !password) {
      error.textContent = "Enter your employee ID or work email and password.";
      return;
    }
    error.textContent = "";
    button.disabled = true;

    try {
      var response = await fetch(apiBase + "/api/v1/auth/login", {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ identity: identity, password: password })
      });

      if (!response.ok) {
        if (response.status === 429) {
          error.textContent = "Too many sign-in attempts. Try again later.";
        } else {
          error.textContent = "Unable to sign in. Check your credentials.";
        }
        return;
      }

      var result = await response.json();
      csrfToken = result.csrf_token;
      redirectForRole(result.user);
    } catch (_) {
      error.textContent = "Unable to reach the server. Try again.";
    } finally {
      button.disabled = false;
    }
  });

  document.getElementById("logoutBtn").addEventListener("click", async function () {
    try {
      await fetch(apiBase + "/api/v1/auth/logout", {
        method: "POST",
        credentials: "include",
        headers: { "X-CSRF-Token": csrfToken }
      });
    } catch (_) {
      // Clear the local view even if the logout request cannot reach the server.
    }

    csrfToken = "";
    form.reset();
    welcome.hidden = true;
    form.hidden = false;
  });

  restoreSession();
</script>
</body>
</html>
