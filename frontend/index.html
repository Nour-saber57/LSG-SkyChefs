<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LSG SkyChefs - Sign in</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #17212b;
    }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
    }
    main {
      width: min(380px, calc(100% - 32px));
      box-sizing: border-box;
      padding: 32px;
      border-radius: 12px;
      background: white;
      box-shadow: 0 8px 28px rgba(20, 40, 60, 0.12);
    }
    h1 {
      margin: 0 0 24px;
      text-align: center;
    }
    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: 600;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 11px 12px;
      border: 1px solid #bcc6d0;
      border-radius: 6px;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      border: 0;
      border-radius: 6px;
      background: #1769aa;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.65;
      cursor: wait;
    }
    #message {
      min-height: 20px;
      margin: 16px 0 0;
      text-align: center;
    }
    .actions {
      display: flex;
      gap: 8px;
    }
    .secondary {
      background: #edf2f6;
      color: #17212b;
    }
    .error {
      color: #b42318;
    }
  </style>
</head>
<body>
  <main>
    <h1>SkyChefs Sign In</h1>
    <form id="login-form">
      <label for="role">Account type</label>
      <select id="role" name="role" style="width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #bcc6d0;border-radius:6px;font-size:16px">
        <option value="user">Employee</option>
        <option value="admin">Admin</option>
      </select>

      <label for="identity">Employee ID or email</label>
      <input id="identity" name="identity" autocomplete="username" required>

      <label for="name">Full name</label>
      <input id="name" name="name" autocomplete="name">

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <div class="actions">
        <button id="submit" type="submit">Sign in</button>
        <button id="register" class="secondary" type="button">Create account</button>
      </div>
      <p id="message" role="status"></p>
    </form>
  </main>

  <script>
    const form = document.querySelector("#login-form");
    const submit = document.querySelector("#submit");
    const register = document.querySelector("#register");
    const message = document.querySelector("#message");
    const identity = document.querySelector("#identity");
    const name = document.querySelector("#name");
    const password = document.querySelector("#password");
    const role = document.querySelector("#role");

    async function readJson(response) {
      const data = await response.json();
      if (!response.ok) {
        throw new Error(Array.isArray(data.detail) ? data.detail[0].msg : (data.detail || "Request failed"));
      }
      return data;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      submit.disabled = true;
      message.className = "";
      message.textContent = "";

      try {
        const response = await fetch(`http://127.0.0.1:8000/api/v1/auth/${role.value}/login`, {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            identity: identity.value,
            password: password.value
          })
        });

        const data = await readJson(response);
        message.textContent = `Signed in as ${data.user.role}: ${data.user.name}`;
      } catch (error) {
        message.className = "error";
        message.textContent = error.message;
      } finally {
        submit.disabled = false;
      }
    });

    register.addEventListener("click", async () => {
      if (role.value !== "user") {
        message.className = "error";
        message.textContent = "Use the Employee option to create an account.";
        return;
      }

      register.disabled = true;
      submit.disabled = true;
      message.className = "";
      message.textContent = "";

      if (!name.value.trim()) {
        register.disabled = false;
        submit.disabled = false;
        message.className = "error";
        message.textContent = "Enter a full name.";
        return;
      }

      try {
        const response = await fetch("http://127.0.0.1:8000/api/v1/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            identity: identity.value,
            name: name.value,
            password: password.value
          })
        });
        const data = await readJson(response);
        message.textContent = `Account created for ${data.identity}.`;
      } catch (error) {
        message.className = "error";
        message.textContent = error.message;
      } finally {
        register.disabled = false;
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
